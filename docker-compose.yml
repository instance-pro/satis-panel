# Satis Panel: web UI for composer/satis (private Composer repository).
#
# Deploy as a "Docker Compose" resource pointing at this repository. Coolify builds
# the image from the Dockerfile, assigns the domain via SERVICE_FQDN_PANEL_80 and
# routes traffic to port 80. No Traefik labels are required: nginx protects the
# package files with basic auth (users managed in the UI), the UI has its own login
# and the webhook endpoint stays reachable.
#
# All variables below show up in Coolify under "Environment Variables".
services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: 'instance-pro/satis-panel:latest'
    restart: unless-stopped
    expose:
      - 80
    volumes:
      # satis.json, htpasswd, optional auth.json, generated secrets
      - 'satis-panel-config:/data/config'
      # packages.json, p2/, include/, dist/, index.html generated by satis
      - 'satis-panel-output:/data/output'
      # sessions, logs, build state
      - 'satis-panel-var:/var/www/html/var'
      # composer home (auth.json, package cache)
      - 'satis-panel-composer:/var/www/.composer'
      # SSH deploy key and known_hosts
      - 'satis-panel-ssh:/var/www/.ssh'
    environment:
      # Coolify magic variable: domain for this service, proxied to container port 80.
      - SERVICE_FQDN_PANEL_80
      # Login for the web UI. The password may be plain text or a bcrypt hash.
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Shared secret in the webhook URL (POST /webhook/<secret>). Generated and
      # stored in the config volume when empty; shown on the dashboard.
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      # Symfony secret. Generated once and stored in the config volume when empty.
      - APP_SECRET=${APP_SECRET:-}
      # Public URL of the repository, e.g. https://satis.example.com. Written into
      # satis.json on first start, editable later under Configuration.
      - SATIS_HOMEPAGE=${SATIS_HOMEPAGE:-}
      - SATIS_REPOSITORY_NAME=${SATIS_REPOSITORY_NAME:-satis-panel/repository}
      # Set to 1 to serve the package files without authentication.
      - SATIS_AUTH_DISABLED=${SATIS_AUTH_DISABLED:-0}
      # Optional: import an existing private SSH key on first start (or use the UI).
      - SSH_PRIVATE_KEY=${SSH_PRIVATE_KEY:-}
      # Optional: self-hosted git servers to trust on start, e.g. "git.example.com gitlab.example.com:2222".
      - SSH_KEYSCAN_HOSTS=${SSH_KEYSCAN_HOSTS:-}
      # Composer authentication for HTTPS sources, e.g. {"github-oauth":{"github.com":"ghp_..."}}
      - COMPOSER_AUTH=${COMPOSER_AUTH:-}
      - APP_ENV=${APP_ENV:-prod}
      - APP_DEBUG=${APP_DEBUG:-0}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1/login']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  satis-panel-config:
  satis-panel-output:
  satis-panel-var:
  satis-panel-composer:
  satis-panel-ssh:
