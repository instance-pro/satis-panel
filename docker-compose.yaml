# Satis Panel: web UI for composer/satis (private Composer repository).
#
# Deploy as a "Docker Compose" resource pointing at this repository. Coolify builds
# the image from the Dockerfile, assigns the domain via SERVICE_FQDN_PANEL_80 and
# routes traffic to port 80. No Traefik labels are required: nginx protects the
# package files with basic auth (users managed in the UI), the UI has its own login
# and the webhook endpoint stays reachable.
#
# All variables below show up in Coolify under "Environment Variables".
services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: 'instance-pro/satis-panel:latest'
    restart: unless-stopped
    expose:
      - 80
    volumes:
      # satis.json, htpasswd, optional auth.json, generated secrets
      - 'satis-panel-config:/data/config'
      # packages.json, p2/, include/, dist/, index.html generated by satis
      - 'satis-panel-output:/data/output'
      # sessions, logs, build state
      - 'satis-panel-var:/var/www/html/var'
      # composer home (auth.json, package cache)
      - 'satis-panel-composer:/var/www/.composer'
      # SSH deploy key and known_hosts
      - 'satis-panel-ssh:/var/www/.ssh'
    environment:
      # Coolify magic variable: domain for this service, proxied to container port 80.
      - SERVICE_FQDN_PANEL_80
      # Login for the web UI. The password may be plain text or a bcrypt hash.
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Abort a satis build after this many seconds (0 = no limit).
      - BUILD_TIMEOUT=${BUILD_TIMEOUT:-1800}
      # Timezone for the UI, logs and build times, e.g. Europe/Berlin.
      - TZ=${TZ:-UTC}
      # Webhook request log and build queue (see the redis service below).
      # SERVICE_PASSWORD_REDIS is generated by Coolify; for local testing set it in .env.
      - SERVICE_PASSWORD_REDIS
      - REDIS_URL=redis://:${SERVICE_PASSWORD_REDIS}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    # Coolify's proxy only routes to a healthy container. A short start_interval gets
    # the new container into the routing a few seconds after a deploy instead of
    # after the first regular interval (Coolify recreates compose services in place,
    # rolling updates are only available with the Dockerfile build pack, see README).
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1/login']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    # Time the old container gets to finish requests before it is killed on deploy.
    stop_grace_period: 15s

  # Redis keeps the webhook request log and the build queue.
  redis:
    image: 'redis:8-alpine'
    restart: unless-stopped
    # Not published on any host port, only reachable inside the compose network,
    # and protected with the generated password.
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'yes', '--requirepass', '${SERVICE_PASSWORD_REDIS}']
    environment:
      - SERVICE_PASSWORD_REDIS
    volumes:
      - 'satis-panel-redis:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${SERVICE_PASSWORD_REDIS}', '--no-auth-warning', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  satis-panel-redis:
  satis-panel-config:
  satis-panel-output:
  satis-panel-var:
  satis-panel-composer:
  satis-panel-ssh:
